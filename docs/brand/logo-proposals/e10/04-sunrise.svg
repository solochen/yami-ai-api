<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EHangAI Sunrise mark">
  <!-- 04 · 启航 Sunrise — 地平线日出与光路倒影，「东方 E / 启航」 -->
  <rect width="512" height="512" rx="115" fill="#1A1715"/>

  <!-- 日 -->
  <path d="M 136 336 A 120 120 0 0 1 376 336 Z" fill="#FF8711"/>
  <circle cx="216" cy="296" r="16" fill="#F8F4F0" opacity="0.85"/>

  <!-- 海平线与光路 -->
  <line x1="80" y1="336" x2="432" y2="336" stroke="#F2C18D" stroke-width="10" opacity="0.55" stroke-linecap="round"/>
  <line x1="216" y1="374" x2="296" y2="374" stroke="#FF8711" stroke-width="12" opacity="0.7" stroke-linecap="round"/>
  <line x1="226" y1="402" x2="286" y2="402" stroke="#FF8711" stroke-width="10" opacity="0.5" stroke-linecap="round"/>
  <line x1="234" y1="428" x2="278" y2="428" stroke="#FF8711" stroke-width="8" opacity="0.3" stroke-linecap="round"/>

  <!-- 晨星 -->
  <circle cx="150" cy="132" r="9" fill="#C9B7AC" opacity="0.8"/>
  <circle cx="390" cy="168" r="6" fill="#C9B7AC" opacity="0.5"/>
</svg>
