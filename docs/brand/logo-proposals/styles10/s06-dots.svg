<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EHangAI Dot Matrix mark">
  <!-- S06 · 点阵 Dot Matrix — 5×5 灯阵点亮字母 E，终端像素的科技感 -->
  <rect width="512" height="512" rx="115" fill="#1A1715"/>

  <!-- 未点亮阵 -->
  <g fill="#C9B7AC" opacity="0.16">
    <circle cx="166" cy="256" r="13"/><circle cx="346" cy="256" r="13"/>
    <circle cx="436" cy="256" r="13"/>
    <circle cx="76" cy="166" r="13"/><circle cx="166" cy="166" r="13"/>
    <circle cx="256" cy="166" r="13"/><circle cx="346" cy="166" r="13"/><circle cx="436" cy="166" r="13"/>
    <circle cx="76" cy="346" r="13"/><circle cx="166" cy="346" r="13"/>
    <circle cx="256" cy="346" r="13"/><circle cx="346" cy="346" r="13"/><circle cx="436" cy="346" r="13"/>
  </g>

  <!-- 点亮 E -->
  <g fill="#FF8711">
    <circle cx="76" cy="76" r="30"/><circle cx="166" cy="76" r="30"/>
    <circle cx="256" cy="76" r="30"/><circle cx="346" cy="76" r="30"/>
    <circle cx="76" cy="166" r="30"/><circle cx="76" cy="256" r="30"/>
    <circle cx="76" cy="346" r="30"/>
    <circle cx="166" cy="256" r="30"/><circle cx="256" cy="256" r="30"/>
    <circle cx="76" cy="436" r="30"/><circle cx="166" cy="436" r="30"/>
    <circle cx="256" cy="436" r="30"/><circle cx="346" cy="436" r="30"/>
  </g>
  <circle cx="256" cy="76" r="42" fill="#FF8711"/>
  <circle cx="256" cy="76" r="16" fill="#F8F4F0"/>
</svg>
