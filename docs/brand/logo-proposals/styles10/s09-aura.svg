<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EHangAI Aura mark">
  <!-- S09 · 光晕 Aura — 深空中的柔光与四芒星，梦幻 AI 光环 -->
  <defs>
    <radialGradient id="a-bg" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0" stop-color="#2B1D12"/>
      <stop offset="0.55" stop-color="#171009"/>
      <stop offset="1" stop-color="#0E0A06"/>
    </radialGradient>
    <radialGradient id="a-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8711" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FF8711" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FF8711" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-mini" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2C18D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F2C18D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#a-bg)"/>

  <circle cx="256" cy="250" r="210" fill="url(#a-glow)"/>

  <!-- 四芒星 -->
  <path d="M 256 118 L 270 236 L 388 250 L 270 264 L 256 382 L 242 264 L 124 250 L 242 236 Z"
        fill="#F8F4F0"/>
  <circle cx="256" cy="250" r="30" fill="#FF8711"/>

  <!-- 辅星 -->
  <circle cx="392" cy="140" r="42" fill="url(#a-mini)"/>
  <circle cx="392" cy="140" r="9" fill="#F2C18D"/>
  <circle cx="132" cy="356" r="5" fill="#C9B7AC" opacity="0.7"/>

  <!-- 极光弧 -->
  <path d="M 84 424 Q 256 372 428 424" fill="none" stroke="#F2C18D"
        stroke-width="7" opacity="0.3" stroke-linecap="round"/>
</svg>
