<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EHangAI Glass mark">
  <!-- S02 · 玻璃拟态 Glassmorphism — 层叠玻璃片 + 柔光核心，现代 SaaS 质 -->
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A211B"/>
      <stop offset="1" stop-color="#15100D"/>
    </linearGradient>
    <radialGradient id="g-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8711" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#FF8711" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF8711" stop-opacity="0"/>
    </radialGradient>
    <filter id="g-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#g-bg)"/>

  <!-- 柔光斑 -->
  <circle cx="168" cy="168" r="110" fill="#FF8711" opacity="0.5" filter="url(#g-blur)"/>
  <circle cx="356" cy="356" r="90" fill="#F2C18D" opacity="0.3" filter="url(#g-blur)"/>

  <!-- 玻璃片层叠 -->
  <rect x="132" y="132" width="212" height="212" rx="52"
        fill="#F8F4F0" fill-opacity="0.07" stroke="#F8F4F0" stroke-opacity="0.3" stroke-width="3"
        transform="rotate(-9 238 238)"/>
  <rect x="168" y="168" width="212" height="212" rx="52"
        fill="#F8F4F0" fill-opacity="0.09" stroke="#F8F4F0" stroke-opacity="0.35" stroke-width="3"
        transform="rotate(5 274 274)"/>

  <!-- 核心光 -->
  <circle cx="256" cy="256" r="150" fill="url(#g-glow)"/>
  <circle cx="256" cy="256" r="58" fill="#FF8711"/>
  <circle cx="238" cy="238" r="13" fill="#F8F4F0" opacity="0.9"/>
</svg>
