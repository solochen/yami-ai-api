<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="YiHangAI Voyage mark">
  <!-- Concept 01 · 航迹 Voyage — 深暖炭底 + 上升航迹 + 航点星标 -->
  <rect width="512" height="512" rx="115" fill="#1A1715"/>

  <!-- 上升航迹 -->
  <path d="M 96 404 C 284 400 348 326 348 176"
        fill="none" stroke="#FF8711" stroke-width="42" stroke-linecap="round"/>

  <!-- 起点航点 -->
  <circle cx="96" cy="404" r="31" fill="none" stroke="#F2C18D" stroke-width="5" opacity="0.45"/>
  <circle cx="96" cy="404" r="20" fill="#F2C18D"/>

  <!-- 终点航点（主星） -->
  <circle cx="348" cy="170" r="58" fill="none" stroke="#F2C18D" stroke-width="5" opacity="0.3"/>
  <circle cx="348" cy="170" r="42" fill="#FF8711"/>
  <circle cx="335" cy="157" r="10" fill="#F8F4F0"/>

  <!-- 途中星尘（四芒星） -->
  <path d="M 164 118 L 172 134 L 188 142 L 172 150 L 164 166 L 156 150 L 140 142 L 156 134 Z"
        fill="#C9B7AC" opacity="0.75"/>
  <path d="M 210 232 L 215 242 L 225 247 L 215 252 L 210 262 L 205 252 L 195 247 L 205 242 Z"
        fill="#C9B7AC" opacity="0.45"/>
</svg>
